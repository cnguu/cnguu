# 创建 Snake, see: https://github.com/Platane/snk

# 工作流名称
name: Generate Snake

# 工作流触发时机, see: https://docs.github.com/zh/actions/using-workflows/triggering-a-workflow
# 触发条件修改为: 当 main 分支有 push 操作 || 每天 22 点国内早上 6 点
on:
  push:
    branches:
      - main

  schedule:
    - cron: '0 22 * * *'

# 作业, see: https://docs.github.com/zh/actions/using-jobs/using-jobs-in-a-workflow
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 使用 actions/checkout, see: https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@v3

      # 使用 Platane/snk 生成图片(贪吃蛇), see: https://github.com/Platane/snk
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?color_snake=#1677ff&color_dots=#f6ffed,#b7eb8f,#73d13d,#389e0d,#092b00
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#40a9ff&color_dots=#141414,#135200,#389e0d,#73d13d,#b7eb8f
            assets/ocean.gif?color_snake=#1890ff&color_dots=#f0f5ff,#adc6ff,#597ef7,#1890ff,#003a8c

      # 使用 EndBug/add-and-commit 提交代码, see: https://github.com/EndBug/add-and-commit
      - name: Push to GitHub
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: 'Generate Contribution Snake'
